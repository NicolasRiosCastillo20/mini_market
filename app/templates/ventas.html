<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Venta</title>
</head>
<body>

    <h1>Registro de Nueva Venta</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Detalles de la Venta</legend>

            <label for="producto">Producto:</label>
            <input type="text" id="producto" name="producto" required><br><br>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" value="1" required><br><br>

            <label for="precio">Precio Unitario:</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0" value="0.00" required><br><br>

            <label for="fecha">Fecha de Venta:</label>
            <input type="date" id="fecha" name="fecha" required><br><br>
        </fieldset>

        <!-- <fieldset>
            <legend>Método de Pago</legend>
            <label for="pago_efectivo">Efectivo</label>
            <input type="radio" id="pago_efectivo" name="metodo_pago" value="efectivo"><br>
            <label for="pago_tarjeta">Tarjeta</label>
            <input type="radio" id="pago_tarjeta" name="metodo_pago" value="tarjeta"><br>
            <label for="pago_transferencia">Transferencia</label>
            <input type="radio" id="pago_transferencia" name="metodo_pago" value="transferencia"><br><br>
        </fieldset> -->

        <button type="submit">Registrar Venta</button>
        <button type="reset">Limpiar Formulario</button>

    </form>

</body>
</html>
